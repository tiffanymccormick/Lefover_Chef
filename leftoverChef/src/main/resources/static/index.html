<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com">
        <link rel="stylesheet" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
        <title>Leftover Chef</title>
        <style>
            body { background-color: #f7ffdd; }
        </style>
    </head>
    <body>
        <h1 style="font-size:50px"> 
            Leftover Chef
            <img id="img" src="logo_cooking.png" width="50" height="50">
            <a href="instruct.html">
                <input style="position: absolute; right: 20px; top: 50px" type="image" src="instructions.png" width="50" height="50" name="saveForm" class="btTxt submit" id="saveForm" /> 
            </a>
        </h1>

        <div class="food-saved">
            <strong>Food Saved:</strong> <span id="food-saved">0</span> lbs
        </div>
        
        <img style="position: absolute; margin-left: 0px; width: 400px; height: 450px;" id="img" src="open_fridge.png">
        
        <p style="position: absolute; left: 450px; top: 70px; font-size: 30px">
            <strong>Input Leftover Ingredients:</strong>
        </p>

        <div class="ingredients-box">
            <textarea id="input-text" style="position: absolute; left: 450px; height: 300px; width: 500px; top: 150px; background-color: #efd780"
                    placeholder="Enter ingredients separated by commas (e.g., chicken, eggs, milk)"></textarea>
        </div>

        <a href="recipe.html">
            <button class="generateMeal" style="position: absolute; left: 500px; top: 500px" type="submit">Generate Meal</button>
        </a>

        <script src="app.js"></script>
    </body>
</html>
